<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture Hotel Search</title>
<style>body{font:16px system-ui;margin:40px}label{display:block;margin:8px 0}
#results{display:none;margin-top:24px;border-top:1px solid #ccc;padding-top:12px}</style></head>
<body>
<h1>Fixture Hotel Search</h1>
<label>Destination <input id="dest" role="textbox" aria-label="Destination"></label>
<label>Sort by
  <select id="sort" aria-label="Sort by">
    <option value="">Choose…</option>
    <option value="price">Price</option>
    <option value="rating">Rating</option>
    <option value="design">Design</option>
  </select>
</label>
<label><input type="checkbox" id="free" aria-label="Free cancellation"> Free cancellation</label>
<button id="go">Search</button>
<div id="results">
  <h2 id="summary"></h2>
  <ul>
    <li><a href="#casa-flora" id="casa">Casa Flora</a> — design hotel</li>
    <li><a href="#hotel-alfa" id="alfa">Hotel Alfa</a> — budget</li>
  </ul>
</div>
<script>
document.getElementById('go').addEventListener('click', () => {
  const dest = document.getElementById('dest').value.trim()
  const sort = document.getElementById('sort').value
  const free = document.getElementById('free').checked
  const r = document.getElementById('results')
  const ok = dest.toLowerCase() === 'lisbon' && sort === 'design' && free
  document.getElementById('summary').textContent =
    `Search: destination="${dest}" sort="${sort || 'none'}" freeCancellation=${free} -> ${ok ? 'MATCH' : 'NO MATCH'}`
  r.style.display = 'block'
})
</script>
</body></html>
